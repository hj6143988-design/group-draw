<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:,">
<title>分组抽签</title>
<style>
  :root{
    --bg:#f6f7f6; --panel:#fff; --ink:#1c2024; --ink-2:#5b6469; --ink-3:#8b9499;
    --line:#dfe3e4; --accent:#0f766e; --accent-ink:#fff; --accent-soft:#e6f2f0;
    --radius:8px; --shadow:0 1px 2px rgba(18,24,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181a; --panel:#1d2224; --ink:#e8ebeb; --ink-2:#a3adaf; --ink-3:#788486;
      --line:#2c3335; --accent:#2dd4bf; --accent-ink:#04211e; --accent-soft:#1b3a37; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px}
  h1{margin:0 0 14px;font-size:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .ask{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
  .picks{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .picks button{
    padding:16px 4px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);color:var(--ink);font:15px/1.2 inherit;font-weight:600;cursor:pointer;
    min-height:56px;
  }
  .picks button:hover{border-color:var(--ink-3)}
  .picks button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .result{text-align:center;padding:18px 0 6px;min-height:118px;display:flex;align-items:center;justify-content:center}
  .placeholder{color:var(--ink-3);font-size:14px}
  .big{font-size:62px;line-height:1;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .big small{font-size:20px;font-weight:600;color:var(--ink-2);margin-left:8px;letter-spacing:0}
  .who{margin-top:6px;font-size:15px;font-weight:600}
  .mine{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
  button.ghost{
    display:block;width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:var(--radius);
    background:transparent;color:var(--ink-2);font:13px inherit;cursor:pointer;
  }
  button.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
  .hint{font-size:12px;color:var(--ink-3);margin:10px 0 0;text-align:center}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--ink);
    color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;
    pointer-events:none;transition:opacity .18s,transform .18s;z-index:9;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:.95;transform:translate(-50%,0)}
  .hidden{display:none!important}
  @media (max-width:400px){
    .big{font-size:54px}
    .picks button{min-height:52px;padding:14px 2px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>分组抽签</h1>

  <section class="panel">
    <p class="ask">你是第几组？</p>
    <div class="picks" id="picks">
      <button type="button" data-g="1">第 1 组</button>
      <button type="button" data-g="2">第 2 组</button>
      <button type="button" data-g="3">第 3 组</button>
      <button type="button" data-g="4">第 4 组</button>
    </div>
    <div class="result">
      <div class="placeholder" id="ph">点上面的按钮</div>
      <div class="hidden" id="shown">
        <div class="big" id="num">-<small>号</small></div>
        <div class="who" id="who"></div>
        <div class="mine">只看得到本组号码</div>
      </div>
    </div>
  </section>

  <button class="ghost" id="share" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3A5 5 0 0 0 13.5 3.5L12 5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3A5 5 0 0 0 10.5 20.5L12 19"/></svg>
    复制链接
  </button>
  <p class="hint">把同一条链接发到群里，每人点自己的组，只看得到自己那一组。</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var GROUPS = 4;
  var $ = function(id){ return document.getElementById(id); };
  var picksEl = $('picks'), ph = $('ph'), shown = $('shown');
  var numEl = $('num'), whoEl = $('who'), shareBtn = $('share'), toastEl = $('toast');
  var map = null, picked = 0;

  /* ---------- SHA-256（纯 JS，保证任何设备算出的结果一致） ---------- */
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  function utf8Bytes(str){
    var out = [];
    for (var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if (c < 0x80){ out.push(c); }
      else if (c < 0x800){ out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c >= 0xd800 && c <= 0xdbff){
        var c2 = i + 1 < str.length ? str.charCodeAt(i + 1) : 0;
        if (c2 >= 0xdc00 && c2 <= 0xdfff){
          var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
          out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
          i++;
        } else { out.push(0xef, 0xbf, 0xbd); }
      }
      else if (c >= 0xdc00 && c <= 0xdfff){ out.push(0xef, 0xbf, 0xbd); }
      else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return out;
  }
  function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }
  function toHex8(n){ return ('00000000' + (n >>> 0).toString(16)).slice(-8); }

  function sha256Hex(str){
    var bytes = utf8Bytes(str), len = bytes.length;
    var lo = (len * 8) >>> 0, hi = Math.floor(len / 536870912);
    var total = Math.ceil((len + 9) / 64) * 64;
    var b = new Uint8Array(total);
    b.set(bytes);
    b[len] = 0x80;
    b[total-8] = (hi >>> 24) & 255; b[total-7] = (hi >>> 16) & 255;
    b[total-6] = (hi >>> 8) & 255;  b[total-5] = hi & 255;
    b[total-4] = (lo >>> 24) & 255; b[total-3] = (lo >>> 16) & 255;
    b[total-2] = (lo >>> 8) & 255;  b[total-1] = lo & 255;

    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var w = new Uint32Array(64);
    for (var off = 0; off < total; off += 64){
      var i;
      for (i = 0; i < 16; i++){
        w[i] = ((b[off + i*4] << 24) | (b[off + i*4 + 1] << 16) | (b[off + i*4 + 2] << 8) | b[off + i*4 + 3]) >>> 0;
      }
      for (i = 16; i < 64; i++){
        var s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
        var s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      var a=H[0], bb=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
      for (i = 0; i < 64; i++){
        var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        var maj = (a & bb) ^ (a & c) ^ (bb & c);
        var t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d + t1) >>> 0; d=c; c=bb; bb=a; a=(t1 + t2) >>> 0;
      }
      H[0]=(H[0]+a)>>>0;  H[1]=(H[1]+bb)>>>0; H[2]=(H[2]+c)>>>0;  H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0;  H[5]=(H[5]+f)>>>0;  H[6]=(H[6]+g)>>>0;  H[7]=(H[7]+h)>>>0;
    }
    return H.map(toHex8).join('');
  }

  /* ---------- 号码：排名即号码，天然不重复 ---------- */
  function buildMap(seed){
    var rows = [];
    for (var g = 1; g <= GROUPS; g++) rows.push({ g: g, sig: sha256Hex(seed + '\n#group:' + g) });
    rows.sort(function(x, y){
      if (x.sig < y.sig) return -1;
      if (x.sig > y.sig) return 1;
      return x.g - y.g;
    });
    var out = {};
    rows.forEach(function(r, i){ out[r.g] = i + 1; });
    return out;
  }

  function makeSeed(){
    var buf = new Uint32Array(4);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
    else for (var i = 0; i < 4; i++) buf[i] = Math.floor(Math.random() * 4294967296);
    return Array.prototype.map.call(buf, function(n){
      return ('00000000' + (n >>> 0).toString(16)).slice(-8);
    }).join('');
  }
  function seedFromUrl(){
    var m = (location.hash || '').match(/[#&]s=([0-9a-f]{8,64})/i);
    return m ? m[1].toLowerCase() : '';
  }
  function putSeedInUrl(seed){
    var base = location.href.split('#')[0];
    try { history.replaceState(null, '', base + '#s=' + seed); }
    catch (e) { location.hash = 's=' + seed; }
  }

  /* ---------- 渲染 ---------- */
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 1800);
  }

  function pick(g){
    picked = g;
    picksEl.classList.add('hidden');   // 看一次就收起，避免有人逐个点开看全四组
    ph.classList.add('hidden');
    shown.classList.remove('hidden');
    numEl.innerHTML = map[g] + '<small>号</small>';
    whoEl.textContent = '第 ' + g + ' 组';
  }

  function start(){
    var seed = seedFromUrl() || makeSeed();
    if (!seedFromUrl()) putSeedInUrl(seed);
    map = buildMap(seed);
    picked = 0;
    numEl.innerHTML = '-<small>号</small>';
    whoEl.textContent = '';
    shown.classList.add('hidden');
    ph.classList.remove('hidden');
    picksEl.classList.remove('hidden');
  }

  function copy(text, okMsg){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(okMsg); }
      catch (e) { toast('复制失败，请手动复制地址栏链接'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
    } else fallback();
  }

  picksEl.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button[data-g]') : null;
    if (!btn) return;
    pick(parseInt(btn.getAttribute('data-g'), 10));
  });

  shareBtn.addEventListener('click', function(){
    copy(location.href, '链接已复制，发到钉钉群即可');
  });

  window.addEventListener('hashchange', function(){ start(); });
  start();
})();
</script>
</body>
</html>
