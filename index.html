<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:,">
<title>分组抽签</title>
<style>
  :root{
    --bg:#f6f7f6; --panel:#fff; --ink:#1c2024; --ink-2:#5b6469; --ink-3:#8b9499;
    --line:#dfe3e4; --accent:#0f766e; --accent-ink:#fff; --accent-soft:#e6f2f0;
    --radius:8px; --shadow:0 1px 2px rgba(18,24,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181a; --panel:#1d2224; --ink:#e8ebeb; --ink-2:#a3adaf; --ink-3:#788486;
      --line:#2c3335; --accent:#2dd4bf; --accent-ink:#04211e; --accent-soft:#1b3a37; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 参与者：只有一个号码 ---------- */
  #viewer{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  #viewer .num{font-size:88px;line-height:1;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-2px}
  #viewer .num small{font-size:26px;font-weight:600;color:var(--ink-2);margin-left:10px;letter-spacing:0}
  #viewer .who{margin-top:14px;font-size:17px;font-weight:600}
  #viewer .bad{font-size:16px;color:var(--ink-2);text-align:center}

  /* ---------- 组织者：只有他能看到对照表 ---------- */
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  h1{margin:0 0 6px;font-size:20px}
  .sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 14px;box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .lab{flex:0 0 auto;width:66px;font-size:14px;color:var(--ink-2)}
  .row .val{flex:1;min-width:0;font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .row button{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;
    color:var(--ink);font:13px inherit;cursor:pointer;
  }
  .row button:hover{border-color:var(--accent);color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{font-size:12.5px;color:var(--ink-3);margin:14px 0 0;line-height:1.7}
  .hint b{color:var(--ink-2);font-weight:600}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--ink);
    color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;
    pointer-events:none;transition:opacity .18s,transform .18s;z-index:9;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:.95;transform:translate(-50%,0)}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- 参与者视角：链接里只带自己的组号和号码，页面里没有任何其他组的信息 -->
<div id="viewer" class="hidden">
  <div class="num" id="vnum"></div>
  <div class="who" id="vwho"></div>
  <div class="bad hidden" id="vbad">链接不完整，请找抽签的人重新要一条链接。</div>
</div>

<!-- 组织者视角：只有带种子的链接才会看到这一屏 -->
<div class="wrap hidden" id="admin">
  <h1>分组抽签</h1>
  <p class="sub">每组发自己那一条链接，别发在所有人都在的群里。</p>
  <div class="panel" id="rows"></div>
  <p class="hint">
    每条链接里只有<b>那一组自己的号码</b>，没有抽签种子，所以别人拿到也只能看到自己那一组，点来点去也看不到其他组。
    这一屏（网址里带 <b>#s=</b> 的）<b>只有你一个人有，不要转发</b>。
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var GROUPS = 4;
  var $ = function(id){ return document.getElementById(id); };
  var viewerEl = $('viewer'), vnumEl = $('vnum'), vwhoEl = $('vwho'), vbadEl = $('vbad');
  var adminEl = $('admin'), rowsEl = $('rows'), toastEl = $('toast');

  /* ---------- SHA-256（纯 JS，任何设备结果一致） ---------- */
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  function utf8Bytes(str){
    var out = [];
    for (var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if (c < 0x80){ out.push(c); }
      else if (c < 0x800){ out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c >= 0xd800 && c <= 0xdbff){
        var c2 = i + 1 < str.length ? str.charCodeAt(i + 1) : 0;
        if (c2 >= 0xdc00 && c2 <= 0xdfff){
          var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
          out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
          i++;
        } else { out.push(0xef, 0xbf, 0xbd); }
      }
      else if (c >= 0xdc00 && c <= 0xdfff){ out.push(0xef, 0xbf, 0xbd); }
      else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return out;
  }
  function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }
  function toHex8(n){ return ('00000000' + (n >>> 0).toString(16)).slice(-8); }

  function sha256Hex(str){
    var bytes = utf8Bytes(str), len = bytes.length;
    var lo = (len * 8) >>> 0, hi = Math.floor(len / 536870912);
    var total = Math.ceil((len + 9) / 64) * 64;
    var b = new Uint8Array(total);
    b.set(bytes);
    b[len] = 0x80;
    b[total-8] = (hi >>> 24) & 255; b[total-7] = (hi >>> 16) & 255;
    b[total-6] = (hi >>> 8) & 255;  b[total-5] = hi & 255;
    b[total-4] = (lo >>> 24) & 255; b[total-3] = (lo >>> 16) & 255;
    b[total-2] = (lo >>> 8) & 255;  b[total-1] = lo & 255;

    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var w = new Uint32Array(64);
    for (var off = 0; off < total; off += 64){
      var i;
      for (i = 0; i < 16; i++){
        w[i] = ((b[off + i*4] << 24) | (b[off + i*4 + 1] << 16) | (b[off + i*4 + 2] << 8) | b[off + i*4 + 3]) >>> 0;
      }
      for (i = 16; i < 64; i++){
        var s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
        var s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      var a=H[0], bb=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
      for (i = 0; i < 64; i++){
        var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        var maj = (a & bb) ^ (a & c) ^ (bb & c);
        var t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d + t1) >>> 0; d=c; c=bb; bb=a; a=(t1 + t2) >>> 0;
      }
      H[0]=(H[0]+a)>>>0;  H[1]=(H[1]+bb)>>>0; H[2]=(H[2]+c)>>>0;  H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0;  H[5]=(H[5]+f)>>>0;  H[6]=(H[6]+g)>>>0;  H[7]=(H[7]+h)>>>0;
    }
    return H.map(toHex8).join('');
  }

  /* ---------- 号码：排名即号码，四组天然不重复 ---------- */
  function buildMap(seed){
    var rows = [];
    for (var g = 1; g <= GROUPS; g++) rows.push({ g: g, sig: sha256Hex(seed + '\n#group:' + g) });
    rows.sort(function(x, y){
      if (x.sig < y.sig) return -1;
      if (x.sig > y.sig) return 1;
      return x.g - y.g;
    });
    var out = {};
    rows.forEach(function(r, i){ out[r.g] = i + 1; });
    return out;
  }
  function makeSeed(){
    var buf = new Uint32Array(4);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
    else for (var i = 0; i < 4; i++) buf[i] = Math.floor(Math.random() * 4294967296);
    return Array.prototype.map.call(buf, function(n){
      return ('00000000' + (n >>> 0).toString(16)).slice(-8);
    }).join('');
  }

  /* ---------- 网址参数 ---------- */
  function hash(){
    return (location.hash || '').replace(/^#/, '');
  }
  function param(name){
    var m = hash().match(new RegExp('(?:^|&)' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function baseUrl(){
    return location.href.split('#')[0];
  }
  function seedFromUrl(){
    var s = param('s');
    return /^[0-9a-f]{8,64}$/i.test(s) ? s.toLowerCase() : '';
  }
  function putSeedInUrl(seed){
    try { history.replaceState(null, '', baseUrl() + '#s=' + seed); }
    catch (e) { location.hash = 's=' + seed; }
  }
  /* 参与者链接：只带组号和号码，不带种子 */
  function groupLink(g, n){
    return baseUrl() + '#g=' + g + '&v=' + n;
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 1800);
  }
  function copy(text, okMsg){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(okMsg); }
      catch (e) { toast('复制失败，请手动选中地址栏'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
    } else fallback();
  }

  /* ---------- 参与者视角 ---------- */
  function showViewer(){
    var g = parseInt(param('g'), 10);
    var v = parseInt(param('v'), 10);
    viewerEl.classList.remove('hidden');
    if (!(g >= 1 && g <= GROUPS) || !(v >= 1 && v <= GROUPS)){
      vnumEl.classList.add('hidden');
      vwhoEl.classList.add('hidden');
      vbadEl.classList.remove('hidden');
      return;
    }
    vnumEl.innerHTML = v + '<small>号</small>';
    vwhoEl.textContent = '第 ' + g + ' 组';
  }

  /* ---------- 组织者视角 ---------- */
  function showAdmin(seed){
    var map = buildMap(seed);
    adminEl.classList.remove('hidden');
    rowsEl.innerHTML = '';
    for (var g = 1; g <= GROUPS; g++){
      (function(g){
        var row = document.createElement('div');
        row.className = 'row';
        var lab = document.createElement('span');
        lab.className = 'lab'; lab.textContent = '第 ' + g + ' 组';
        var val = document.createElement('span');
        val.className = 'val'; val.textContent = map[g] + ' 号';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>第 ' + g + ' 组链接';
        btn.addEventListener('click', function(){ copy(groupLink(g, map[g]), '第 ' + g + ' 组链接已复制'); });
        row.appendChild(lab); row.appendChild(val); row.appendChild(btn);
        rowsEl.appendChild(row);
      })(g);
    }
  }

  /* ---------- 入口 ---------- */
  function route(){
    viewerEl.classList.add('hidden');
    adminEl.classList.add('hidden');
    rowsEl.innerHTML = '';
    vbadEl.classList.add('hidden');
    vnumEl.classList.remove('hidden');
    vwhoEl.classList.remove('hidden');

    var seed = seedFromUrl();
    if (seed){
      showAdmin(seed);                     // 网址里带 #s= ：只有组织者能看到对照表
    } else if (param('g') || param('v')){
      showViewer();                        // 网址里带 #g=&v= ：参与者只看到自己那一组
    } else {
      var fresh = makeSeed();
      putSeedInUrl(fresh);
      showAdmin(fresh);                    // 裸网址：开一场新抽签，并生成四条链接
    }
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
