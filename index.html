<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:,">
<title>分组抽签</title>
<style>
  :root{
    --bg:#f6f7f6; --panel:#fff; --ink:#1c2024; --ink-2:#5b6469; --ink-3:#8b9499;
    --line:#dfe3e4; --accent:#0f766e; --accent-ink:#fff; --accent-soft:#e6f2f0;
    --warn:#9a3412; --ok:#15803d; --radius:8px; --shadow:0 1px 2px rgba(18,24,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181a; --panel:#1d2224; --ink:#e8ebeb; --ink-2:#a3adaf; --ink-3:#788486;
      --line:#2c3335; --accent:#2dd4bf; --accent-ink:#04211e; --accent-soft:#1b3a37;
      --warn:#fdba74; --ok:#4ade80; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
  h1{margin:0 0 4px;font-size:19px;font-weight:600}
  .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);margin:0 0 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .dot.bad{background:var(--warn)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:13px;padding:15px}
  .panel h2{margin:0 0 9px;font-size:12.5px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .panel h2 span{font-size:12px;color:var(--ink-3);font-weight:400}
  .stage{position:relative;padding:14px 0 4px;overflow:hidden}
  .pointer{
    position:absolute;left:50%;top:2px;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:19px solid var(--ink);z-index:2;pointer-events:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
  }
  #wheel{display:block;width:100%;max-width:262px;margin:0 auto;transform-origin:50% 50%;will-change:transform;pointer-events:none}
  #wheel text{font-weight:800;font-size:30px;fill:#fff}
  .enter{display:flex;gap:9px;margin-top:8px}
  #g{
    flex:0 0 92px;padding:13px 10px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);color:var(--ink);font:20px inherit;font-weight:700;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  #go{
    flex:1;padding:13px 16px;border:1px solid var(--accent);border-radius:var(--radius);
    background:var(--accent);color:var(--accent-ink);font:15px inherit;font-weight:600;cursor:pointer;
  }
  #go:hover:not(:disabled){filter:brightness(1.06)}
  #go:disabled,#g:disabled{opacity:.55;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .readout{text-align:center;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:10px}
  .readout .idle{color:var(--ink-3);font-size:14px}
  .readout .num{font-size:52px;line-height:1;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .readout .num small{font-size:18px;font-weight:600;color:var(--ink-2);margin-left:7px;letter-spacing:0}
  .readout .who{margin-top:5px;font-size:15px;font-weight:600}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{
    display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .empty{color:var(--ink-3);font-size:13px}
  table{width:100%;border-collapse:collapse}
  td{padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
  tr:last-child td{border-bottom:0}
  td.n{text-align:right;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .final{border-color:var(--accent)}
  #share{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);
    background:transparent;color:var(--ink-2);font:14px inherit;cursor:pointer;
  }
  #share:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:12px;color:var(--ink-3);margin:9px 0 0;text-align:center}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--ink);
    color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;
    pointer-events:none;transition:opacity .18s,transform .18s;z-index:9;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:.95;transform:translate(-50%,0)}
  .hidden{display:none!important}
  @media (prefers-reduced-motion: reduce){ #wheel{transition-duration:.6s!important} }
</style>
</head>
<body>
<div class="wrap">
  <h1>分组抽签</h1>
  <p class="sync"><span class="dot" id="dot"></span><span id="syncText">正在连接…</span></p>

  <section class="panel">
    <div class="stage">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 260 260" role="img" aria-label="抽签转盘">
        <g id="sectors"></g>
        <circle cx="130" cy="130" r="21" fill="#ffffff" stroke="rgba(0,0,0,.12)"/>
        <circle cx="130" cy="130" r="6" fill="#5b6469"/>
      </svg>
    </div>
    <div class="enter">
      <input type="number" id="g" min="1" max="4" step="1" inputmode="numeric" autocomplete="off" placeholder="组号">
      <button id="go" type="button">开始转</button>
    </div>
    <div class="readout">
      <div class="idle" id="idle">输入你是第几组，然后开始转</div>
      <div class="hidden" id="shown">
        <div class="num" id="num">-<small>号</small></div>
        <div class="who" id="who"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>还没被抽走的号码 <span id="poolCount"></span></h2>
    <div class="pills" id="pool"></div>
  </section>

  <section class="panel">
    <h2>已经抽过的组 <span id="drawnCount"></span></h2>
    <div class="pills" id="drawn"></div>
  </section>

  <section class="panel final hidden" id="finalPanel">
    <h2>四组抽完，公布顺序</h2>
    <table><tbody id="finalBody"></tbody></table>
  </section>

  <button id="share" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3A5 5 0 0 0 13.5 3.5L12 5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3A5 5 0 0 0 10.5 20.5L12 19"/></svg>
    复制链接发给四个组
  </button>
  <p class="hint">大家点开同一条链接，各自输入自己的组号抽签，四台手机实时同步。</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  var GROUPS = 4;
  var COLORS = ['#0d9488', '#2563eb', '#d97706', '#e11d48'];
  var API = 'https://ntfy.sh/';
  var SPIN_MS = 3200;

  var $ = function(id){ return document.getElementById(id); };
  var sectorsEl = $('sectors'), wheelEl = $('wheel');
  var gEl = $('g'), goEl = $('go'), idleEl = $('idle'), shownEl = $('shown');
  var numEl = $('num'), whoEl = $('who');
  var poolEl = $('pool'), poolCount = $('poolCount');
  var drawnEl = $('drawn'), drawnCount = $('drawnCount');
  var finalPanel = $('finalPanel'), finalBody = $('finalBody');
  var shareEl = $('share'), toastEl = $('toast');
  var dotEl = $('dot'), syncText = $('syncText');

  var TOPIC = '', KEY = '';
  var claims = {};                                   // id -> claim，天然去重（SSE 重连会重放）
  var state = { res: {}, leftover: [1,2,3,4] };
  var busy = false, spinning = false, wheelLocked = false;
  var resultTimer = null, es = null, pollTimer = null, sseGot = false;

  /* ---------- 工具 ---------- */
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 2400);
  }
  function randHex(bytes){
    var b = new Uint8Array(bytes);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
    else for (var i = 0; i < bytes; i++) b[i] = Math.floor(Math.random() * 256);
    return Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  function randIndex(max){
    if (window.crypto && crypto.getRandomValues){
      var limit = Math.floor(4294967296 / max) * max;
      var buf = new Uint32Array(1), v;
      do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
      return v % max;
    }
    return Math.floor(Math.random() * max);
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* ---------- 公共黑板：ntfy.sh（免注册、支持跨域） ---------- */
  function parseClaim(m){
    if (!m || m.event !== 'message' || !m.message) return null;
    var p;
    try { p = JSON.parse(m.message); } catch (e) { return null; }
    if (!p || p.k !== KEY) return null;
    if (typeof p.g !== 'number' || typeof p.n !== 'number') return null;
    return { id: String(m.id || ''), time: Number(m.time || 0), g: p.g, n: p.n };
  }
  function addClaim(c){
    if (!c || !c.id || claims[c.id]) return false;
    claims[c.id] = c;
    state = resolve(Object.keys(claims).map(function(k){ return claims[k]; }));
    return true;
  }
  function readOnce(){
    return fetch(API + TOPIC + '/json?poll=1&since=all')
      .then(function(r){ if (!r.ok) throw new Error('read ' + r.status); return r.text(); })
      .then(function(text){
        var added = 0;
        text.split('\n').forEach(function(line){
          line = line.trim();
          if (!line) return;
          var m;
          try { m = JSON.parse(line); } catch (e) { return; }
          if (addClaim(parseClaim(m))) added++;
        });
        return added;
      });
  }
  function writeClaim(g, n){
    return fetch(API + TOPIC, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ k: KEY, g: g, n: n })
    }).then(function(r){ if (!r.ok) throw new Error('write ' + r.status); return true; });
  }
  /* 谁先记上谁算数：按服务端时间排序，一个组只认第一次，一个号只能被拿走一次 */
  function resolve(list){
    list.sort(function(a, b){
      if (a.time !== b.time) return a.time - b.time;
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    });
    var res = {}, taken = {};
    list.forEach(function(c){
      if (!(c.g >= 1 && c.g <= GROUPS && c.n >= 1 && c.n <= GROUPS)) return;
      if (res[c.g] !== undefined) return;
      if (taken[c.n]) return;
      res[c.g] = c.n; taken[c.n] = true;
    });
    var leftover = [];
    for (var i = 1; i <= GROUPS; i++) if (!taken[i]) leftover.push(i);
    return { res: res, leftover: leftover };
  }

  function sync(ok){
    if (ok){
      dotEl.classList.remove('bad');
      syncText.textContent = '已同步 · ' + Object.keys(state.res).length + ' / ' + GROUPS + ' 组已抽';
    } else {
      dotEl.classList.add('bad');
      syncText.textContent = '连接不上黑板，正在重试…';
    }
  }
  function startStream(){
    try {
      es = new EventSource(API + TOPIC + '/sse?since=all');
    } catch (e) { startPolling(); return; }
    es.onopen = function(){ sseGot = true; stopPolling(); sync(true); };
    es.onmessage = function(ev){
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (addClaim(parseClaim(m))){
        sseGot = true;
        sync(true);
        renderAll();
      }
    };
    es.onerror = function(){ sync(false); startPolling(); };
    setTimeout(function(){ if (!sseGot) startPolling(); }, 4000);
  }
  function startPolling(){
    if (pollTimer) return;
    pollTimer = setInterval(function(){
      if (busy) return;
      readOnce().then(function(){ sync(true); renderAll(); }).catch(function(){ sync(false); });
    }, 6000);
  }
  function stopPolling(){
    if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  /* ---------- 转盘 ---------- */
  function polar(cx, cy, r, deg){
    var a = deg * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  function drawWheel(nums){
    var cx = 130, cy = 130, r = 118;
    sectorsEl.innerHTML = '';
    if (!nums.length){
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
      c.setAttribute('fill', '#dfe3e4');
      sectorsEl.appendChild(c);
      return;
    }
    var step = 360 / nums.length;
    nums.forEach(function(n, i){
      var start = -90 - step / 2 + i * step, end = start + step;
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      if (nums.length === 1){
        path.setAttribute('d', 'M ' + cx + ' ' + cy + ' m -' + r + ' 0 a ' + r + ' ' + r + ' 0 1 0 ' + (2*r) + ' 0 a ' + r + ' ' + r + ' 0 1 0 -' + (2*r) + ' 0');
      } else {
        var p1 = polar(cx, cy, r, start), p2 = polar(cx, cy, r, end);
        path.setAttribute('d', 'M ' + cx + ' ' + cy + ' L ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) +
          ' A ' + r + ' ' + r + ' 0 ' + ((end - start) > 180 ? 1 : 0) + ' 1 ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2) + ' Z');
      }
      path.setAttribute('fill', COLORS[i % COLORS.length]);
      path.setAttribute('stroke', 'rgba(255,255,255,.85)');
      path.setAttribute('stroke-width', '2');
      sectorsEl.appendChild(path);

      var mid = polar(cx, cy, r * 0.62, -90 + i * step);
      var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', mid.x.toFixed(2));
      t.setAttribute('y', mid.y.toFixed(2));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dy', '0.35em');
      t.textContent = n;
      sectorsEl.appendChild(t);
    });
  }
  function spinTo(index, total){
    return new Promise(function(done){
      var step = 360 / total;
      var targetMod = (360 - index * step) % 360;
      var jitter = (randIndex(1000) / 1000 - 0.5) * step * 0.62;
      var finalDeg = 360 * 5 + targetMod + jitter;
      wheelEl.style.transition = 'none';
      wheelEl.style.transform = 'rotate(0deg)';
      void wheelEl.offsetWidth;
      var dur = SPIN_MS;
      try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) dur = 600; } catch (e) {}
      wheelEl.style.transition = 'transform ' + dur + 'ms cubic-bezier(.16,.72,.16,1)';
      wheelEl.style.transform = 'rotate(' + finalDeg + 'deg)';
      setTimeout(done, dur + 60);
    });
  }

  /* ---------- 渲染 ---------- */
  function renderAll(){
    var left = state.leftover.slice().sort(function(a, b){ return a - b; });
    poolEl.innerHTML = '';
    if (!left.length){
      var e = document.createElement('span'); e.className = 'empty'; e.textContent = '号码已经全部抽走';
      poolEl.appendChild(e);
    } else {
      left.forEach(function(n){
        var s = document.createElement('span'); s.className = 'pill'; s.textContent = n + ' 号';
        poolEl.appendChild(s);
      });
    }
    poolCount.textContent = '还剩 ' + left.length + ' 个';

    var ds = Object.keys(state.res).map(Number).sort(function(a, b){ return a - b; });
    drawnEl.innerHTML = '';
    if (!ds.length){
      var e2 = document.createElement('span'); e2.className = 'empty'; e2.textContent = '还没有人抽';
      drawnEl.appendChild(e2);
    } else {
      ds.forEach(function(g){
        var s = document.createElement('span'); s.className = 'pill'; s.textContent = '第 ' + g + ' 组';
        drawnEl.appendChild(s);
      });
    }
    drawnCount.textContent = ds.length + ' / ' + GROUPS;

    if (ds.length === GROUPS){
      finalBody.innerHTML = '';
      for (var g = 1; g <= GROUPS; g++){
        var tr = document.createElement('tr');
        var td1 = document.createElement('td'); td1.textContent = '第 ' + g + ' 组';
        var td2 = document.createElement('td'); td2.className = 'n'; td2.textContent = state.res[g] + ' 号';
        tr.appendChild(td1); tr.appendChild(td2);
        finalBody.appendChild(tr);
      }
      finalPanel.classList.remove('hidden');
    } else {
      finalPanel.classList.add('hidden');
    }
    // 刚转完的那一下要留着给别人看落点，别马上把盘面重画掉
    if (!wheelLocked) drawWheel(left);
  }
  function showResult(g, n){
    idleEl.classList.add('hidden');
    shownEl.classList.remove('hidden');
    numEl.innerHTML = n + '<small>号</small>';
    whoEl.textContent = '第 ' + g + ' 组';
    wheelLocked = true;
    clearTimeout(resultTimer);
    resultTimer = setTimeout(function(){
      shownEl.classList.add('hidden');
      idleEl.classList.remove('hidden');
      idleEl.textContent = '输入你是第几组，然后开始转';
      wheelLocked = false;
      renderAll();
    }, 20000);
  }

  /* ---------- 抽签 ---------- */
  async function submit(attempt){
    if (busy || spinning) return;
    var g = parseInt(gEl.value, 10);
    if (!g || g < 1 || g > GROUPS){ toast('请输入 1 到 ' + GROUPS + ' 之间的组号'); gEl.focus(); return; }

    busy = true;
    goEl.disabled = true;
    gEl.disabled = true;
    shownEl.classList.add('hidden');
    idleEl.classList.remove('hidden');

    try {
      idleEl.textContent = '正在和大家的手机同步…';
      await readOnce();
      sync(true);
      renderAll();

      if (state.res[g] !== undefined){ idleEl.classList.add('hidden'); toast('第 ' + g + ' 组已经抽过了'); return; }
      if (!state.leftover.length){ idleEl.classList.add('hidden'); toast('号码已经全部抽走了'); return; }

      var nums = state.leftover.slice().sort(function(a, b){ return a - b; });
      var n = nums[randIndex(nums.length)];
      var idx = nums.indexOf(n);

      wheelLocked = false;
      drawWheel(nums);
      spinning = true;
      idleEl.textContent = '转盘转动中…';
      await spinTo(idx, nums.length);
      spinning = false;

      await writeClaim(g, n);
      await sleep(900);
      await readOnce();
      sync(true);
      renderAll();

      if (state.res[g] === n){
        showResult(g, n);
        gEl.value = '';
      } else if (state.res[g] !== undefined){
        idleEl.classList.add('hidden');
        toast('第 ' + g + ' 组已经抽过了');
      } else if ((attempt || 0) < 3){
        toast('慢了一步，号码被抢走了，再转一次');
        busy = false;
        goEl.disabled = false;
        gEl.disabled = false;
        await sleep(500);
        return submit((attempt || 0) + 1);
      } else {
        idleEl.classList.add('hidden');
        toast('号码冲突，请再点一次');
      }
    } catch (e) {
      sync(false);
      idleEl.classList.add('hidden');
      toast('网络不通，请再点一次');
    } finally {
      spinning = false;
      busy = false;
      goEl.disabled = false;
      gEl.disabled = false;
    }
  }

  /* ---------- 入口 ---------- */
  function hashParam(name){
    var m = (location.hash || '').match(new RegExp('(?:^|[#&])' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function boot(){
    TOPIC = hashParam('t');
    KEY = hashParam('k');
    if (!/^[A-Za-z0-9_-]{8,64}$/.test(TOPIC) || !/^[A-Za-z0-9_-]{8,64}$/.test(KEY)){
      TOPIC = 'draw-' + randHex(8);
      KEY = randHex(10);
      try { history.replaceState(null, '', location.href.split('#')[0] + '#t=' + TOPIC + '&k=' + KEY); }
      catch (e) { location.hash = 't=' + TOPIC + '&k=' + KEY; }
    }
    goEl.addEventListener('click', function(){ submit(0); });
    gEl.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); submit(0); } });
    shareEl.addEventListener('click', function(){
      var link = location.href;
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('链接已复制，发到群里即可'); }
        catch (e) { toast('复制失败，请手动复制地址栏'); }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(link).then(function(){ toast('链接已复制，发到群里即可'); }, fallback);
      } else fallback();
    });

    readOnce().then(function(){ sync(true); renderAll(); }).catch(function(){ sync(false); });
    startStream();
  }
  boot();
})();
</script>
</body>
</html>
